<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121416">
  <title>Scrabble Online – Multiplayer v10</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #121416;
      --panel: #1a1d20;
      --grid: #24292e;
      --cell: #3a3f44;
      --border: #4a5056;
      --gold: #d4a359;
      --gold2: #f3e5ab;
      --blue: #4a90e2;
      --blue2: #155799;
      --orange: #f39c12;
      --red: #c0392b;
      --text: #fff;
      --muted: #9da5ac;
      --green: #38a169;
      --shadow: 0 10px 25px rgba(0,0,0,.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Segoe UI, Arial, sans-serif; }
    body { background: var(--bg); color: var(--gold2); padding: 12px; min-height: 100vh; display: flex; justify-content: center; }
    button, input { font: inherit; }
    button { border: 1px solid #7d541e; background: linear-gradient(#d4a359,#b07d35); color: #121416; font-weight: 800; border-radius: 6px; padding: 10px 13px; cursor: pointer; box-shadow: 0 2px 5px #0008; transition: .15s; }
    button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    button:disabled { opacity: .35; cursor: not-allowed; filter: grayscale(1); transform: none; }
    .blue { background: linear-gradient(#2b6cb0,#1a4971); color: #fff; border-color: #153a5b; }
    .gray { background: linear-gradient(#4a5056,#33373b); color: #fff; border-color: #222528; }
    .danger { background: linear-gradient(#8c3a3a,#662222); color: #fff; border-color: #551111; }
    .green { background: linear-gradient(#38a169,#276749); color: #fff; border-color: #22543d; }
    
    #setup-screen { width: min(440px, 100%); margin: 35px auto; background: var(--panel); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); text-align: center; }
    #setup-screen h1 { font-size: 27px; color: var(--gold2); margin-bottom: 5px; }
    #setup-screen .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    label { display: block; color: var(--muted); font-size: 12px; text-align: left; margin: 8px 0 5px; }
    input { width: 100%; padding: 11px; border: 1px solid var(--border); background: var(--bg); color: #fff; border-radius: 6px; outline: none; }
    input:focus { border-color: var(--gold); }
    .setup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .lobby-box { margin-top: 16px; padding: 14px; background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; }
    .room-code { font-size: 30px; letter-spacing: 6px; color: var(--gold); margin: 5px 0 10px; }
    .status { font-size: 12px; margin-top: 10px; min-height: 18px; color: var(--muted); }
    
    #game-screen { display: none; width: 100%; max-width: 1420px; }
    .layout { width: 100%; display: grid; grid-template-columns: minmax(300px, 760px) minmax(300px, 720px); gap: 18px; align-items: start; }
    .board-frame { background: var(--panel); padding: 10px; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); position: sticky; top: 10px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    .connection { padding: 5px 8px; border-radius: 20px; background: #252a2e; color: var(--muted); }
    .connection.ok { color: #8ee6b0; }
    .connection.bad { color: #ff9a9a; }
    
    #board { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; background: var(--grid); padding: 4px; border-radius: 7px; width: 100%; aspect-ratio: 1; }
    .cell { background: var(--cell); position: relative; display: flex; align-items: center; justify-content: center; border-radius: 2px; user-select: none; color: #fff; font-weight: 900; font-size: clamp(7px, 1.7cqw, 14px); overflow: hidden; container-type: inline-size; }
    .cell.L2 { background: var(--blue); }
    .cell.L3 { background: var(--blue2); }
    .cell.W2, .cell.STAR { background: var(--orange); }
    .cell.W3 { background: var(--red); }
    .cell.drag-over { outline: 3px solid var(--gold); filter: brightness(1.3); }
    .cell.preview { box-shadow: inset 0 0 0 2px var(--gold); }
    
    .tile { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fff, #e8e8e8); color: #111; border: 1px solid #c8c8c8; border-radius: 4px; font-weight: 900; font-family: Arial Black, Segoe UI, sans-serif; font-size: clamp(9px, 2.7cqw, 22px); position: relative; cursor: grab; user-select: none; box-shadow: 0 2px 4px #0008, inset 0 1px #fff; }
    .tile:active { cursor: grabbing; }
    .tile .pts { position: absolute; right: 3px; bottom: 2px; font: 700 clamp(6px, 1.1cqw, 9px) Arial; color: #555; }
    .tile.wild { background: linear-gradient(135deg, #fff7d8, #e6d28d); }
    .tile.selected { outline: 3px solid var(--gold); box-shadow: 0 0 10px var(--gold); }
    
    .side { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 13px; box-shadow: 0 5px 15px #0004; }
    .panel h3 { font-size: 15px; margin-bottom: 9px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .score-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; margin-bottom: 6px; border-radius: 6px; background: var(--bg); border: 1px solid transparent; color: var(--muted); font-size: 13px; }
    .score-row.active { border-color: var(--gold); color: #fff; background: #242a2e; }
    .score-row.me { box-shadow: inset 3px 0 var(--gold); }
    .badge { font-size: 10px; padding: 2px 5px; border-radius: 4px; background: #333; color: var(--gold2); margin-left: 4px; }
    
    .rack-box { background: var(--bg); padding: 9px; border: 1px solid var(--border); border-radius: 7px; min-height: 62px; }
    .rack { display: flex; gap: 5px; justify-content: center; align-items: center; min-height: 50px; }
    .rack .tile { width: clamp(36px, 7vw, 50px); height: clamp(36px, 7vw, 50px); font-size: clamp(16px, 3.6vw, 23px); }
    
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 9px; }
    .controls button { font-size: 12px; padding: 10px 6px; }
    .controls .wide { grid-column: span 2; }
    
    .commentary { margin-top: 9px; padding: 9px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; min-height: 42px; text-align: center; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .chat-panel { height: 330px; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 12px; margin-bottom: 7px; }
    .chat-msg { margin-bottom: 6px; line-height: 1.35; word-break: break-word; }
    .chat-msg .author { font-weight: 800; color: var(--gold); }
    .chat-row { display: flex; gap: 6px; }
    .chat-row input { padding: 8px; font-size: 12px; }
    .chat-row button { padding: 8px 11px; font-size: 12px; }
    
    .history { max-height: 190px; overflow: auto; font-size: 12px; color: var(--muted); }
    .history-item { padding: 6px 0; border-bottom: 1px solid #2a2e32; }
    .history-item strong { color: #fff; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.4; }
    
    #modal { display: none; position: fixed; inset: 0; background: #000d; z-index: 50; align-items: center; justify-content: center; padding: 15px; }
    .modal { width: min(500px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; box-shadow: 0 15px 45px #000; text-align: center; }
    .modal h2 { color: var(--gold); margin-bottom: 12px; }
    .final-row { display: flex; justify-content: space-between; padding: 10px; background: var(--bg); border-radius: 6px; margin: 5px 0; font-weight: 700; }
    .winner { border: 2px solid var(--gold); color: #fff; }
    .modal button { width: 100%; margin-top: 12px; }
    .letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
    .letters button { padding: 9px 2px; font-size: 14px; }
    .small { font-size: 10px; color: var(--muted); }

    @media(max-width: 1050px) {
      .layout { grid-template-columns: minmax(280px, 760px); justify-content: center; }
      .board-frame { position: static; }
      .side { grid-template-columns: 1fr 1fr; }
      .chat-panel { height: 300px; }
    }
    @media(max-width: 650px) {
      body { padding: 7px; }
      .layout { display: block; }
      .board-frame { padding: 6px; }
      .side { display: block; }
      .panel { margin-top: 9px; }
      .score-panel { display: none; }
      .chat-panel { height: 250px; }
      .topbar { font-size: 11px; }
      .setup-actions { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr 1fr; }
      .rack { gap: 3px; }
      .rack .tile { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>
  <div id="setup-screen">
    <h1>SCRABBLE ONLINE</h1>
    <div class="sub">Multiplayer v10 • bez slovníku</div>
    
    <label for="player-name-input">Tvoje jméno</label>
    <input id="player-name-input" maxlength="20" placeholder="Napiš své jméno" value="Hráč">
    
    <div class="setup-actions">
      <button onclick="createGame()">Založit hru</button>
      <button class="blue" onclick="joinGame()">Připojit se</button>
    </div>
    
    <label for="join-code-input">Kód místnosti</label>
    <input id="join-code-input" maxlength="4" inputmode="numeric" placeholder="např. 4821">
    
    <div id="lobby-info" class="lobby-box" style="display:none">
      <div class="small">KÓD MÍSTNOSTI</div>
      <div id="room-code-display" class="room-code">----</div>
      <div class="small">PŘIPOJENÍ HRÁČI</div>
      <ul id="connected-players-list" style="list-style:none;margin:7px 0"></ul>
      <div class="setup-actions">
        <button id="shuffle-btn" class="gray" style="display:none" onclick="shufflePlayers()">Rozlosovat</button>
        <button id="start-btn" style="display:none" onclick="hostStartGame()">Odstartovat</button>
      </div>
      <div id="setup-status" class="status"></div>
    </div>
    <div id="connection-status" class="status">Připraveno.</div>
  </div>

  <div id="game-screen">
    <div class="layout">
      <div class="board-frame">
        <div class="topbar">
          <strong>SCRABBLE ONLINE</strong>
          <span id="connection-badge" class="connection">● nepřipojeno</span>
        </div>
        <div id="board"></div>
      </div>
      
      <div class="side">
        <div class="panel score-panel">
          <h3>Skóre</h3>
          <div id="scoreboard"></div>
          <div style="font-size:11px;color:var(--muted);margin-top:7px">Kamenů v pytlíku: <strong id="bag-count">0</strong></div>
        </div>
        
        <div class="panel">
          <h3 id="current-player-title">Na tahu: –</h3>
          <div class="hint" id="turn-hint">Čekám na hru…</div>
          <div class="rack-box"><div id="rack" class="rack"></div></div>
          
          <div class="controls">
            <button id="btn-play" onclick="playTurn()">Potvrdit tah</button>
            <button id="btn-recall" class="danger" onclick="recallTiles()">Vrátit</button>
            <button id="btn-swap" class="blue" onclick="openSwapDialog()">Výměna</button>
            <button id="btn-pass" class="gray" onclick="passTurnRequest()">Pass</button>
          </div>
          
          <div id="commentary" class="commentary">🗣️ Připraveno.</div>
        </div>
        
        <div class="panel">
          <h3>Historie tahů</h3>
          <div id="history" class="history"></div>
        </div>
        
        <div class="panel chat-panel">
          <h3>Herní chat</h3>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-row">
            <input id="chat-input" maxlength="300" placeholder="Napište zprávu…" onkeydown="if(event.key==='Enter')sendChatMessage()">
            <button onclick="sendChatMessage()">Odeslat</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal">
    <div class="modal" id="modal-content"></div>
  </div>

  <script>
    'use strict';
    
    const CZECH_TILES = [
      {l:'★',p:0,c:2,w:true},{l:'A',p:1,c:5},{l:'Á',p:2,c:2},{l:'B',p:3,c:2},{l:'C',p:2,c:3},{l:'Č',p:4,c:1},{l:'D',p:1,c:3},{l:'Ď',p:8,c:1},{l:'E',p:1,c:5},{l:'É',p:3,c:1},{l:'Ě',p:3,c:2},{l:'F',p:5,c:1},{l:'G',p:5,c:1},{l:'H',p:2,c:3},{l:'CH',p:4,c:2},{l:'I',p:1,c:4},{l:'Í',p:2,c:3},{l:'J',p:2,c:2},{l:'K',p:1,c:3},{l:'L',p:1,c:3},{l:'M',p:2,c:3},{l:'N',p:1,c:5},{l:'Ň',p:10,c:1},{l:'O',p:1,c:6},{l:'Ó',p:7,c:1},{l:'P',p:1,c:3},{l:'R',p:1,c:3},{l:'Ř',p:4,c:2},{l:'S',p:1,c:4},{l:'Š',p:4,c:2},{l:'T',p:1,c:4},{l:'Ť',p:7,c:1},{l:'U',p:1,c:3},{l:'Ú',p:5,c:1},{l:'Ů',p:4,c:1},{l:'V',p:1,c:4},{l:'X',p:10,c:1},{l:'Y',p:2,c:2},{l:'Ý',p:4,c:2},{l:'Z',p:2,c:2},{l:'Ž',p:4,c:1}
    ];
    
    const LAYOUT = [
      ['W3','','','L2','','','','W3','','','','L2','','','W3'],['','W2','','','','L3','','','','L3','','','','W2',''],['','','W2','','','','L2','','L2','','','','W2','',''],['L2','','','W2','','','','L2','','','','W2','','','L2'],['','','','','W2','','','','','','W2','','','',''],['','L3','','','','L3','','','','L3','','','','L3',''],['','','L2','','','','L2','','L2','','','','L2','',''],['W3','','','L2','','','','STAR','','','','L2','','','W3'],['','','L2','','','','L2','','L2','','','','L2','',''],['','L3','','','','L3','','','','L3','','','','L3',''],['','','','','W2','','','','','','W2','','','',''],['L2','','','W2','','','','L2','','','','W2','','','L2'],['','','W2','','','','L2','','L2','','','','W2','',''],['','W2','','','','L3','','','','L3','','','','W2',''],['W3','','','L2','','','','W3','','','','L2','','','W3']
    ];
    
    let peer = null, myId = '', isHost = false, hostConn = null, clientConns = new Map(), roomCode = '';
    let players = [], activePlayerIdx = 0, tileBag = [], clientBagCount = 0, boardState = emptyBoard(), chatMessages = [], history = [], currentCommentary = '🗣️ Připraveno.', isGameOver = false, gameOverData = null;
    let uncommitted = [], selectedRackIndices = [], localRack = [], turnPending = false;
    
    function emptyBoard() { return Array.from({length: 15}, () => Array(15).fill(null)); }
    function deep(x) { return JSON.parse(JSON.stringify(x)); }
    function esc(s) { return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function setStatus(t, game = false) { document.getElementById(game ? 'commentary' : 'connection-status').textContent = t; }
    function setConnection(ok, text) {
      const e = document.getElementById('connection-badge');
      e.textContent = (ok ? '● ' : '● ') + text;
      e.className = 'connection ' + (ok ? 'ok' : 'bad');
    }
    function generateRoomCode() { return String(Math.floor(1000 + Math.random() * 9000)); }
    function createTile(def, i) { return { id: 'T' + i + '_' + Math.random().toString(36).slice(2, 8), letter: def.l, pts: def.p, isWildcard: !!def.w, assignedLetter: null }; }
    function buildBag() { let a = [], n = 0; CZECH_TILES.forEach(d => { for (let i = 0; i < d.c; i++) a.push(createTile(d, n++)); }); return a.sort(() => Math.random() - .5); }
    function drawTiles(count) { const a = []; while (count > 0 && tileBag.length) { a.push(tileBag.pop()); count--; } return a; }
    
    function createGame() {
      const name = document.getElementById('player-name-input').value.trim() || 'Zakladatel';
      isHost = true;
      roomCode = generateRoomCode();
      peer = new Peer('scrabble-room-' + roomCode);
      peer.on('open', id => {
        myId = id;
        players = [{id, name, score: 0, rack: []}];
        showLobby();
        setConnection(true, 'místnost vytvořena');
        setStatus('Čekám na dalšího hráče…');
      });
      peer.on('connection', conn => { clientConns.set(conn.peer, conn); wireHostConnection(conn); });
      peer.on('error', e => { setConnection(false, 'chyba'); setStatus('Chyba spojení: ' + (e.type || 'neznámá chyba')); });
    }
    
    function joinGame() {
      const name = document.getElementById('player-name-input').value.trim() || 'Hráč';
      roomCode = document.getElementById('join-code-input').value.trim();
      if (!/^\d{4}$/.test(roomCode)) return alert('Zadejte čtyřmístný kód místnosti.');
      isHost = false;
      peer = new Peer();
      peer.on('open', id => {
        myId = id;
        hostConn = peer.connect('scrabble-room-' + roomCode, { reliable: true });
        wireClientConnection(hostConn);
        hostConn.on('open', () => { sendHost({ type: 'JOIN', id: myId, name }); });
      });
      peer.on('error', () => { setConnection(false, 'chyba'); setStatus('Místnost nebyla nalezena nebo je obsazená.'); });
    }
    
    function wireHostConnection(conn) {
      conn.on('open', () => { setConnection(true, 'připojeno'); conn.send({ type: 'WELCOME', hostId: myId }); });
      conn.on('data', d => handleHostMessage(conn, d));
      conn.on('close', () => { clientConns.delete(conn.peer); removeDisconnected(conn.peer); });
      conn.on('error', () => { clientConns.delete(conn.peer); removeDisconnected(conn.peer); });
    }
    
    function wireClientConnection(conn) {
      conn.on('data', handleClientMessage);
      conn.on('close', () => { setConnection(false, 'spojení přerušeno'); setStatus('Spojení s hostitelem bylo přerušeno.', 'game'); });
      conn.on('error', () => setConnection(false, 'chyba spojení'));
    }
    
    function removeDisconnected(id) {
      if (!isHost) return;
      const i = players.findIndex(p => p.id === id);
      if (i < 0) return;
      players.splice(i, 1);
      if (activePlayerIdx >= players.length) activePlayerIdx = 0;
      broadcast({ type: 'LOBBY_UPDATE', players: publicPlayers() });
      updateLobbyUI();
    }
    
    function publicPlayers() { return players.map(p => ({ id: p.id, name: p.name, score: p.score })); }
    
    function showLobby() {
      document.getElementById('lobby-info').style.display = 'block';
      document.getElementById('room-code-display').textContent = roomCode;
      document.getElementById('start-btn').style.display = isHost ? 'block' : 'none';
      document.getElementById('shuffle-btn').style.display = isHost ? 'block' : 'none';
      updateLobbyUI();
    }
    
    function updateLobbyUI() {
      document.getElementById('connected-players-list').innerHTML = players.map((p, i) => `<li style="padding:4px">${i + 1}. ${esc(p.name)} ${p.id === myId ? '(Ty)' : ''}</li>`).join('');
    }
    
    function shufflePlayers() {
      if (!isHost || players.length < 2) return;
      for (let i = players.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }
      broadcast({ type: 'LOBBY_UPDATE', players: publicPlayers() });
      updateLobbyUI();
    }
    
    function hostStartGame() {
      if (!isHost || players.length < 2) return alert('K hraní jsou potřeba alespoň 2 hráči.');
      tileBag = buildBag();
      boardState = emptyBoard();
      activePlayerIdx = 0;
      chatMessages = [];
      history = [];
      isGameOver = false;
      gameOverData = null;
      players.forEach(p => { p.score = 0; p.rack = drawTiles(7); });
      currentCommentary = '🎲 Hra začala! Začíná ' + players[0].name + '.';
      sendState();
      showGame();
    }
    
    function showGame() {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      renderAll();
    }
    
    function broadcast(data) {
      for (const c of clientConns.values()) {
        if (c.open) { try { c.send(data); } catch (e) {} }
      }
    }
    
    function sendHost(data) {
      if (!hostConn || !hostConn.open) return false;
      try { hostConn.send(data); return true; } catch (e) { return false; }
    }
    
    function getStateForClient(viewerId) {
      return {
        players: players.map(p => ({ ...deep(p), rack: p.id === viewerId ? deep(p.rack) : [] })),
        activePlayerIdx,
        tileBagCount: tileBag.length,
        boardState: deep(boardState),
        chatMessages: deep(chatMessages),
        history: deep(history),
        currentCommentary,
        isGameOver,
        gameOverData
      };
    }
    
    function sendState() {
      if (!isHost) return;
      clientBagCount = tileBag.length;
      for (const [id, c] of clientConns) {
        if (c.open) { try { c.send({ type: 'SYNC_STATE', state: getStateForClient(id) }); } catch (e) {} }
      }
      applyState(getStateForClient(myId));
    }
    
    function handleHostMessage(conn, d) {
      if (!d || typeof d.type !== 'string') return;
      if (d.type === 'JOIN') {
        if (players.length >= 4) return conn.send({ type: 'ERROR', message: 'Hra je plná.' });
        if (players.some(p => p.id === d.id)) return;
        players.push({ id: d.id, name: String(d.name || 'Hráč').slice(0, 20), score: 0, rack: [] });
        conn.send({ type: 'LOBBY_UPDATE', players: publicPlayers() });
        broadcast({ type: 'LOBBY_UPDATE', players: publicPlayers() });
        updateLobbyUI();
        return;
      }
      const p = players.find(x => x.id === conn.peer);
      if (!p) return;
      if (d.type === 'PLAY_TURN') hostPlayTurn(String(d.playerId || p.id), d.tiles, conn);
      else if (d.type === 'PASS') hostPass(String(d.playerId || p.id));
      else if (d.type === 'SWAP') hostSwap(String(d.playerId || p.id), d.tileIds);
      else if (d.type === 'CHAT') hostChat(String(d.playerId || p.id), d.text);
    }
    
    function handleClientMessage(d) {
      if (!d) return;
      if (d.type === 'WELCOME') { setConnection(true, 'připojeno k hostiteli'); showLobby(); return; }
      if (d.type === 'LOBBY_UPDATE') { players = (d.players || []).map(p => ({ ...p, rack: [] })); showLobby(); return; }
      if (d.type === 'SYNC_STATE') { turnPending = false; applyState(d.state); showGame(); return; }
      if (d.type === 'CHAT') { chatMessages.push(d.msg); updateChatUI(); return; }
      if (d.type === 'ERROR') { turnPending = false; updateUI(); alert(d.message || 'Chyba'); return; }
    }
    
    function applyState(s) {
      players = deep(s.players || []);
      activePlayerIdx = s.activePlayerIdx || 0;
      clientBagCount = Number.isInteger(s.tileBagCount) ? s.tileBagCount : clientBagCount;
      boardState = deep(s.boardState || emptyBoard());
      chatMessages = deep(s.chatMessages || []);
      history = deep(s.history || []);
      currentCommentary = s.currentCommentary || '';
      isGameOver = !!s.isGameOver;
      gameOverData = s.gameOverData || null;
      uncommitted = [];
      selectedRackIndices = [];
      const me = players.find(p => p.id === myId);
      localRack = me ? deep(me.rack) : [];
      renderAll();
      if (isGameOver && gameOverData) showGameOver(gameOverData);
    }
    
    function renderAll() {
      renderBoard();
      renderRack();
      updateUI();
      updateChatUI();
      updateHistory();
      renderScoreboard();
    }
    
    function renderScoreboard() {
      const sb = document.getElementById('scoreboard');
      if (!sb) return;
      sb.innerHTML = players.map((p, i) => `
        <div class="score-row ${i === activePlayerIdx ? 'active' : ''} ${p.id === myId ? 'me' : ''}">
          <span>${esc(p.name)} ${p.id === myId ? '<span class="badge">Ty</span>' : ''}</span>
          <strong>${p.score} b.</strong>
        </div>
      `).join('');
    }

    function renderBoard() {
      const b = document.getElementById('board');
      b.innerHTML = '';
      for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 15; c++) {
          const cell = document.createElement('div');
          const type = LAYOUT[r][c];
          cell.className = 'cell ' + type;
          cell.dataset.r = r;
          cell.dataset.c = c;
          const t = boardState[r][c];
          if (!t) {
            cell.textContent = type === 'STAR' ? '★' : (type === 'L2' || type === 'W2' ? '2×' : type === 'L3' || type === 'W3' ? '3×' : '');
          } else {
            renderTile(cell, t);
          }
          cell.onclick = () => onCellClick(r, c);
          cell.ondragover = e => { if (canEditBoard() && !boardState[r][c]) { e.preventDefault(); cell.classList.add('drag-over'); } };
          cell.ondragleave = () => cell.classList.remove('drag-over');
          cell.ondrop = e => {
            e.preventDefault();
            cell.classList.remove('drag-over');
            if (!canEditBoard() || boardState[r][c]) return;
            const idx = Number(e.dataTransfer.getData('text/plain'));
            if (Number.isInteger(idx)) placeTile(idx, r, c);
          };
          b.appendChild(cell);
        }
      }
    }
    
    function renderTile(cell, t) {
      cell.innerHTML = '';
      const el = document.createElement('div');
      el.className = 'tile' + (t.isWildcard ? ' wild' : '');
      el.textContent = t.isWildcard && t.assignedLetter ? t.assignedLetter : t.letter;
      const pts = document.createElement('span');
      pts.className = 'pts';
      pts.textContent = t.pts;
      el.appendChild(pts);
      cell.appendChild(el);
    }
    
    function canEditBoard() { return !isGameOver && players[activePlayerIdx]?.id === myId; }
    function getMe() { return players.find(p => p.id === myId); }
    
    function renderRack() {
      const rack = document.getElementById('rack');
      rack.innerHTML = '';
      const me = getMe();
      if (!me) return;
      const myTurn = canEditBoard();
      localRack = localRack.length || uncommitted.length ? localRack : deep(me.rack);
      localRack.forEach((t, idx) => {
        const el = document.createElement('div');
        el.className = 'tile' + (t.isWildcard ? ' wild' : '') + (selectedRackIndices.includes(idx) ? ' selected' : '');
        el.textContent = t.isWildcard && t.assignedLetter ? t.assignedLetter : t.letter;
        const pts = document.createElement('span');
        pts.className = 'pts';
        pts.textContent = t.pts;
        el.appendChild(pts);
        el.onclick = () => { if (!myTurn) return; toggleSelect(idx); };
        if (myTurn) {
          el.draggable = true;
          el.ondragstart = e => e.dataTransfer.setData('text/plain', String(idx));
        }
        rack.appendChild(el);
      });
    }
    
    function toggleSelect(i) {
      selectedRackIndices = selectedRackIndices.includes(i) ? selectedRackIndices.filter(x => x !== i) : [...selectedRackIndices, i];
      renderRack();
    }
    
    function onCellClick(r, c) {
      if (!canEditBoard() || boardState[r][c]) return;
      if (selectedRackIndices.length === 1) placeTile(selectedRackIndices[0], r, c);
    }
    
    function chooseWildcard() {
      return new Promise(resolve => {
        const m = document.getElementById('modal');
        const content = document.getElementById('modal-content');
        const letters = CZECH_TILES.filter(x => x.l !== '★').map(x => x.l);
        content.innerHTML = `<h2>ŽOLÍK</h2><div class="small">Vyber písmeno, které bude žolík zastupovat.</div><div class="letters">${letters.map(l => `<button data-letter="${esc(l)}">${esc(l)}</button>`).join('')}</div><button class="gray" onclick="closeModal()">Zrušit</button>`;
        content.querySelectorAll('[data-letter]').forEach(b => b.onclick = () => {
          const l = b.dataset.letter;
          closeModal();
          resolve(l);
        });
        m.style.display = 'flex';
      });
    }
    
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    
    function placeTile(idx, r, c) {
      if (!canEditBoard() || boardState[r][c]) return;
      const tile = localRack[idx];
      if (!tile) return;
      const put = deep(tile);
      if (put.isWildcard && !put.assignedLetter) {
        chooseWildcard().then(l => { if (l) finishPlace(idx, r, c, l); });
        return;
      }
      finishPlace(idx, r, c, put.assignedLetter || null);
    }
    
    function finishPlace(idx, r, c, assigned) {
      const tile = localRack[idx];
      if (!tile || boardState[r][c]) return;
      const put = deep(tile);
      if (put.isWildcard) put.assignedLetter = assigned;
      localRack.splice(idx, 1);
      boardState[r][c] = put;
      uncommitted.push({ r, c, tile: put });
      selectedRackIndices = [];
      renderBoard();
      renderRack();
      updateUI();
    }
    
    function recallTiles() {
      if (!canEditBoard() || !uncommitted.length) return;
      const placed = uncommitted.map(x => x.tile);
      for (const u of uncommitted) boardState[u.r][u.c] = null;
      const base = getMe()?.rack || [];
      const ids = new Set(placed.map(t => t.id));
      localRack = [...localRack, ...placed];
      const all = deep(base).filter(t => !ids.has(t.id));
      localRack = [...all, ...placed];
      uncommitted = [];
      selectedRackIndices = [];
      renderBoard();
      renderRack();
      updateUI();
    }
    
    function playTurn() {
      if (turnPending) return;
      if (!canEditBoard()) return alert('Teď nejsi na tahu.');
      if (!uncommitted.length) return alert('Nejdříve položte alespoň jeden kámen.');
      const tiles = uncommitted.map(u => ({ r: u.r, c: u.c, tile: deep(u.tile) }));
      turnPending = true;
      updateUI();
      if (isHost) {
        hostPlayTurn(myId, tiles, null);
      } else {
        const ok = sendHost({ type: 'PLAY_TURN', playerId: myId, tiles });
        if (!ok) { turnPending = false; updateUI(); alert('Nepodařilo se odeslat tah. Zkontrolujte spojení.'); }
      }
    }
    
    // ZDE JE ÚPLNĚ ODSTRANĚNA KONTROLA SLOV PODLE SLOVNÍKU
    function validateTurn(player, placements) {
      if (!Array.isArray(placements) || !placements.length) return { ok: false, msg: 'Tah neobsahuje žádný kámen.' };
      if (placements.length > 7) return { ok: false, msg: 'Nelze položit více než 7 kamenů.' };
      const ids = new Set(player.rack.map(t => t.id));
      const seen = new Set();
      for (const x of placements) {
        if (!Number.isInteger(x.r) || x.r < 0 || x.r > 14 || !Number.isInteger(x.c) || x.c < 0 || x.c > 14) return { ok: false, msg: 'Neplatná pozice kamene.' };
        if (seen.has(x.tile?.id) || !ids.has(x.tile?.id)) return { ok: false, msg: 'Neplatný nebo duplicitní kámen.' };
        if (boardState[x.r][x.c]) return { ok: false, msg: 'Některé políčko je již obsazené.' };
        seen.add(x.tile.id);
      }
      const rows = placements.map(x => x.r), cols = placements.map(x => x.c);
      const sameRow = rows.every(r => r === rows[0]), sameCol = cols.every(c => c === cols[0]);
      if (!sameRow && !sameCol) return { ok: false, msg: 'Kameny musí být v jednom řádku nebo sloupci.' };
      if (boardState.every(row => row.every(x => x === null))) {
        if (!placements.some(x => x.r === 7 && x.c === 7)) return { ok: false, msg: 'První tah musí procházet středovým políčkem ★.' };
        if (placements.length < 2) return { ok: false, msg: 'První slovo musí mít alespoň 2 písmena.' };
      }
      const temp = deep(boardState);
      placements.forEach(x => temp[x.r][x.c] = deep(x.tile));
      const ordered = [...placements].sort((a, b) => sameRow ? a.c - b.c : a.r - b.r);
      for (let i = 1; i < ordered.length; i++) {
        if (sameRow && ordered[i].c !== ordered[i - 1].c + 1) return { ok: false, msg: 'Mezi kameny nesmí být mezera.' };
        if (sameCol && ordered[i].r !== ordered[i - 1].r + 1) return { ok: false, msg: 'Mezi kameny nesmí být mezera.' };
      }
      const oldCount = boardState.flat().filter(Boolean).length;
      let touches = false;
      if (oldCount > 0) {
        for (const x of placements) {
          for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const rr = x.r + dr, cc = x.c + dc;
            if (rr >= 0 && rr < 15 && cc >= 0 && cc < 15 && boardState[rr][cc]) touches = true;
          }
        }
      }
      if (oldCount > 0 && !touches) return { ok: false, msg: 'Nový tah musí navazovat na existující kameny.' };
      return { ok: true, temp, sameRow, sameCol };
    }
    
    function wordAt(board, r, c, hor) {
      let rr = r, cc = c;
      while (rr - (hor ? 0 : 1) >= 0 && cc - (hor ? 1 : 0) >= 0 && board[rr - (hor ? 0 : 1)]?.[cc - (hor ? 1 : 0)]) {
        if (hor) cc--; else rr--;
      }
      const cells = [];
      while (rr >= 0 && rr < 15 && cc >= 0 && cc < 15 && board[rr][cc]) {
        cells.push({ r: rr, c: cc, tile: board[rr][cc] });
        if (hor) cc++; else rr++;
      }
      return cells;
    }
    
    function wordText(cells) {
      return cells.map(x => x.tile.isWildcard && x.tile.assignedLetter ? x.tile.assignedLetter : x.tile.letter).join('');
    }
    
    function scoreWord(cells, newSet) {
      if (cells.length < 2) return 0;
      let s = 0, m = 1;
      for (const x of cells) {
        let p = x.tile.pts;
        if (newSet.has(x.r + ',' + x.c)) {
          const type = LAYOUT[x.r][x.c];
          if (type === 'L2') p *= 2;
          if (type === 'L3') p *= 3;
          if (type === 'W2' || type === 'STAR') m *= 2;
          if (type === 'W3') m *= 3;
        }
        s += p;
      }
      return s * m;
    }
    
    function calculateScore(temp, placements, sameRow, sameCol) {
      const set = new Set(placements.map(x => x.r + ',' + x.c));
      const first = placements[0];
      const main = wordAt(temp, first.r, first.c, sameRow);
      let score = scoreWord(main, set);
      const words = [{ text: wordText(main), score: score }];
      for (const p of placements) {
        const cross = wordAt(temp, p.r, p.c, !sameRow);
        if (cross.length >= 2) {
          const sc = scoreWord(cross, set);
          score += sc;
          words.push({ text: wordText(cross), score: sc });
        }
      }
      if (placements.length === 7) score += 50;
      return { score, words, bingo: placements.length === 7 };
    }
    
    function hostPlayTurn(playerId, placements, sourceConn = null) {
      if (!isHost || isGameOver) return;
      if (players[activePlayerIdx]?.id !== playerId) {
        const msg = 'Tento hráč právě není na tahu.';
        if (playerId === myId) alert(msg); else sendToPlayer(playerId, { type: 'ERROR', message: msg });
        return;
      }
      const p = players.find(x => x.id === playerId);
      if (!p) { sendToPlayer(playerId, { type: 'ERROR', message: 'Hráč nebyl nalezen.' }); return; }
      const v = validateTurn(p, placements);
      if (!v.ok) {
        if (playerId === myId) alert(v.msg); else sendToPlayer(playerId, { type: 'ERROR', message: v.msg });
        return;
      }
      const canonical = p.rack.reduce((m, t) => (m.set(t.id, t), m), new Map());
      const safePlacements = placements.map(x => {
        const base = canonical.get(x.tile.id);
        return {
          r: x.r,
          c: x.c,
          tile: { ...deep(base), assignedLetter: base.isWildcard ? String(x.tile.assignedLetter || '').toUpperCase() : null }
        };
      });
      if (safePlacements.some(x => x.tile.isWildcard && !CZECH_TILES.some(d => d.l === x.tile.assignedLetter && d.l !== '★'))) {
        const msg = 'Neplatné písmeno žolíku.';
        if (playerId === myId) alert(msg); else sendToPlayer(playerId, { type: 'ERROR', message: msg });
        return;
      }
      const calc = calculateScore(v.temp, safePlacements, v.sameRow, v.sameCol);
      const used = new Set(safePlacements.map(x => x.tile.id));
      p.rack = p.rack.filter(t => !used.has(t.id));
      safePlacements.forEach(x => v.temp[x.r][x.c] = deep(x.tile));
      boardState = v.temp;
      const need = 7 - p.rack.length;
      p.rack.push(...drawTiles(need));
      p.score += calc.score;
      const names = calc.words.map(w => w.text).filter(Boolean);
      history.push({
        player: p.name,
        words: names.length ? names : ['Tah'],
        score: calc.score,
        time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })
      });
      if (history.length > 50) history.shift();
      currentCommentary = calc.bingo ? `🔥 ${p.name} – BINGO! +${calc.score} bodů` : `✨ ${p.name} zahrál tah za ${calc.score} bodů.`;
      uncommitted = [];
      localRack = [];
      selectedRackIndices = [];
      turnPending = false;
      if (tileBag.length === 0 && p.rack.length === 0) return finishGame('Pytlík je prázdný a hráč nemá žádný kámen.');
      activePlayerIdx = (activePlayerIdx + 1) % players.length;
      sendState();
    }
    
    function hostPass(playerId) {
      if (!isHost || isGameOver || players[activePlayerIdx]?.id !== playerId) return;
      const p = players.find(x => x.id === playerId);
      p._passes = (p._passes || 0) + 1;
      const total = players.reduce((a, x) => a + (x._passes || 0), 0);
      currentCommentary = `⏭️ ${p.name} vynechal tah.`;
      history.push({
        player: p.name,
        words: ['PASS'],
        score: 0,
        time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })
      });
      if (total >= players.length * 2) return finishGame('Všichni hráči provedli celkem dva po sobě jdoucí pasy.');
      activePlayerIdx = (activePlayerIdx + 1) % players.length;
      sendState();
    }
    
    function openSwapDialog() {
      if (!canEditBoard()) return;
      const ids = selectedRackIndices.map(i => localRack[i]?.id).filter(Boolean);
      if (!ids.length) return alert('Označte kameny k výměně.');
      if (tileBag.length < ids.length) return alert('V pytlíku není dostatek kamenů pro výměnu.');
      const ok = confirm(`Vyměnit ${ids.length} ${ids.length === 1 ? 'kámen' : 'kameny'}?`);
      if (!ok) return;
      if (uncommitted.length) recallTiles();
      if (isHost) hostSwap(myId, ids); else sendHost({ type: 'SWAP', tileIds: ids });
    }
    
    function hostSwap(playerId, ids) {
      if (!isHost || isGameOver || players[activePlayerIdx]?.id !== playerId) return;
      const p = players.find(x => x.id === playerId);
      if (!Array.isArray(ids) || !ids.length || ids.length > p.rack.length || tileBag.length < ids.length) return;
      const set = new Set(ids);
      if (ids.some(id => !p.rack.some(t => t.id === id))) return;
      const old = p.rack.filter(t => set.has(t.id));
      p.rack = p.rack.filter(t => !set.has(t.id));
      p.rack.push(...drawTiles(old.length));
      tileBag.push(...old);
      tileBag.sort(() => Math.random() - .5);
      p._passes = (p._passes || 0) + 1;
      currentCommentary = `🔄 ${p.name} vyměnil ${old.length} ${old.length === 1 ? 'kámen' : 'kameny'}.`;
      history.push({
        player: p.name,
        words: ['VÝMĚNA'],
        score: 0,
        time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })
      });
      if (players.reduce((a, x) => a + (x._passes || 0), 0) >= players.length * 2) return finishGame('Hra skončila po sérii pasů a výměn.');
      activePlayerIdx = (activePlayerIdx + 1) % players.length;
      uncommitted = [];
      localRack = [];
      selectedRackIndices = [];
      sendState();
    }
    
    function passTurnRequest() {
      if (!canEditBoard()) return;
      if (uncommitted.length) recallTiles();
      if (isHost) hostPass(myId); else sendHost({ type: 'PASS' });
    }
    
    function hostChat(playerId, text) {
      text = String(text || '').trim().slice(0, 300);
      if (!text) return;
      const p = players.find(x => x.id === playerId);
      const msg = { author: p?.name || 'Hráč', text };
      chatMessages.push(msg);
      if (chatMessages.length > 100) chatMessages.shift();
      broadcast({ type: 'CHAT', msg });
      if (playerId === myId) updateChatUI();
    }
    
    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      if (isHost) hostChat(myId, text); else sendHost({ type: 'CHAT', text });
    }
    
    function sendToPlayer(id, data) {
      const c = clientConns.get(id);
      if (c?.open) c.send(data);
    }
    
    function updateUI() {
      const me = getMe(), myTurn = canEditBoard();
      document.getElementById('btn-play').disabled = !myTurn || !uncommitted.length || turnPending;
      document.getElementById('btn-recall').disabled = !myTurn || !uncommitted.length;
      document.getElementById('btn-swap').disabled = !myTurn || !selectedRackIndices.length;
      document.getElementById('btn-pass').disabled = !myTurn;
      document.getElementById('bag-count').textContent = isHost ? tileBag.length : clientBagCount;
      document.getElementById('current-player-title').textContent = 'Na tahu: ' + (players[activePlayerIdx]?.name || '–');
      document.getElementById('turn-hint').textContent = myTurn ? (uncommitted.length ? 'Kameny jsou na desce, potvrďte tah.' : 'Vyberte kameny z lízátka na desku.') : ('Čeká se na hráče: ' + (players[activePlayerIdx]?.name || ''));
      renderScoreboard();
    }
    
    function updateChatUI() {
      const box = document.getElementById('chat-messages');
      box.innerHTML = chatMessages.map(m => `<div class="chat-msg"><span class="author">${esc(m.author)}:</span> ${esc(m.text)}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    }
    
    function updateHistory() {
      const box = document.getElementById('history');
      box.innerHTML = history.slice().reverse().map(h => `<div class="history-item"><strong>${esc(h.player)}</strong> (${h.time}): ${h.words.join(', ')} <b>+${h.score}</b></div>`).join('');
    }
    
    function showGameOver(data) {
      isGameOver = true;
      gameOverData = data;
      const m = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      const sorted = deep(data.sortedPlayers || players).sort((a, b) => b.score - a.score);
      content.innerHTML = `<h2>KONEC HRY</h2><div class="small" style="margin-bottom:12px">${esc(data.reason)}</div>${sorted.map((p, i) => `<div class="final-row ${i === 0 ? 'winner' : ''}"><span>${i + 1}. ${esc(p.name)}</span><span>${p.score} b.</span></div>`).join('')}<button onclick="location.reload()">Nová hra</button>`;
      m.style.display = 'flex';
    }
    
    function finishGame(reason) {
      isGameOver = true;
      players.forEach(p => {
        const penalty = p.rack.reduce((a, t) => a + t.pts, 0);
        p.score -= penalty;
      });
      const sorted = deep(players).sort((a, b) => b.score - a.score);
      gameOverData = { reason, sortedPlayers: sorted };
      currentCommentary = `🏁 Konec hry: ${reason}`;
      broadcast({ type: 'SYNC_STATE', state: getStateForClient(myId) });
      showGameOver(gameOverData);
    }
  </script>
</body>
</html>
