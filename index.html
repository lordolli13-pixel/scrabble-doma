<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrabble - Bodování</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 20px; border: 2px solid #333; display: flex; flex-direction: column; justify: space-between; }
    .card.active { border-color: #4caf50; background: #253325; }
    .player-name { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; }
    .score { font-size: 3rem; font-weight: bold; color: #ffeb3b; margin-bottom: 15px; }
    .inputs { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="number"] { width: 100%; padding: 12px; font-size: 1.2rem; border-radius: 6px; border: none; outline: none; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-add { background: #4caf50; color: white; }
    .btn-reject { background: #f44336; color: white; }
    .btn-pass { background: #ff9800; color: white; }
    .btn-undo { background: #9c27b0; color: white; }
    button:hover { opacity: 0.9; }
    .commentary { margin-top: 20px; padding: 15px; background: #2a2a2a; border-left: 5px solid #2196f3; border-radius: 4px; font-style: italic; }
  </style>
</head>
<body>

  <div class="grid" id="playersContainer"></div>
  <div class="commentary" id="commentaryBox">Komentátor připraven na hru!</div>

  <script>
    let players = [
      { id: 1, name: "Hráč 1", score: 0, history: [] },
      { id: 2, name: "Hráč 2", score: 0, history: [] }
    ];

    const commentsFail = [
      "Tohle slovo v slovníku opravdu nenajdeš! Tah neplatí.",
      "Pěkná kulišárna, ale rozhodčí vidí všechno! 0 bodů.",
      "Neuznáno! Příště to chce méně fantazie a více pravopisů."
    ];

    const commentsAdd = [
      "Parádní tah! Body jsou na kontě.",
      "Skvěle! Tabulka se začíná vybarvovat.",
      "Výborné slovo, jen tak dál!"
    ];

    function render() {
      const container = document.getElementById("playersContainer");
      container.innerHTML = "";

      players.forEach((p, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="player-name">${p.name}</div>
            <div class="score">${p.score} b.</div>
            <div class="inputs">
              <input type="number" id="input-${p.id}" placeholder="Body za tah" min="0">
            </div>
          </div>
          <div class="btn-group">
            <button class="btn-add" onclick="addPoints(${p.id})">➕ Přidat</button>
            <button class="btn-reject" onclick="rejectTurn(${p.id})" title="Neuznat slovo / storno">❌ Neuznat</button>
            <button class="btn-pass" onclick="passTurn(${p.id})">⏭️ Pass</button>
            <button class="btn-undo" onclick="undoTurn(${p.id})">↩️ Tah zpět</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addPoints(id) {
      const input = document.getElementById(`input-${id}`);
      const pts = parseInt(input.value);
      if (isNaN(pts) || pts < 0) return;

      const player = players.find(p => p.id === id);
      player.history.push(pts);
      player.score += pts;
      input.value = "";
      
      setComment(commentsAdd[Math.floor(Math.random() * commentsAdd.length)]);
      render();
    }

    function rejectTurn(id) {
      const input = document.getElementById(`input-${id}`);
      input.value = "";
      const player = players.find(p => p.id === id);
      player.history.push(0); // Zapíše se 0 bodů
      
      setComment(commentsFail[Math.floor(Math.random() * commentsFail.length)]);
      render();
    }

    function passTurn(id) {
      rejectTurn(id); // Pass funguje stejně jako neuznání (0 bodů)
    }

    function undoTurn(id) {
      const player = players.find(p => p.id === id);
      if (player.history.length === 0) return;
      
      const lastPoints = player.history.pop();
      player.score -= lastPoints;
      setComment(`Tah hráče ${player.name} byl vrácen zpět.`);
      render();
    }

    function setComment(text) {
      document.getElementById("commentaryBox").innerText = text;
    }

    render();
  </script>
</body>
</html>
