<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrabble - Multiplayer v7</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-antracit-dark: #121416;
      --bg-antracit-panel: #1a1d20;
      --board-grid: #24292e;
      --cell-default: #3a3f44;
      --border-color: #4a5056;
      --cell-2l: #4a90e2; 
      --cell-3l: #155799; 
      --cell-2w: #f39c12; 
      --cell-3w: #c0392b; 
      --honey-main: #d4a359;
      --honey-light: #f3e5ab;
      --tile-bg: linear-gradient(135deg, #ffffff 0%, #eaeaea 100%);
      --tile-text: #000000;
      --tile-border: #cccccc;
      --tile-shadow: 0 2px 4px rgba(0,0,0,0.4), inset 0 1px 0 #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    
    body { 
      background: var(--bg-antracit-dark); 
      color: var(--honey-light); 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
    }

    #setup-screen { 
      background: var(--bg-antracit-panel); 
      padding: 25px; 
      border-radius: 8px; 
      max-width: 420px; 
      width: 100%; 
      text-align: center; 
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      margin-top: 40px;
    }
    #setup-screen h2 { font-size: 24px; margin-bottom: 15px; color: var(--honey-light); }
    #setup-screen input { 
      width: 100%; padding: 10px; margin: 6px 0 12px 0; 
      border-radius: 4px; border: 1px solid var(--border-color); 
      background: var(--bg-antracit-dark); color: #ffffff; font-size: 15px; text-align: center;
    }
    
    button { 
      background: linear-gradient(to bottom, #d4a359, #b07d35); 
      border: 1px solid #7d541e; padding: 10px 16px; 
      color: #121416; font-weight: bold; border-radius: 4px; 
      cursor: pointer; transition: all 0.2s; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    button:hover { background: linear-gradient(to bottom, #e2b268, #c48e42); }
    button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

    .lobby-box {
      margin-top: 15px; padding: 12px; background: var(--bg-antracit-dark);
      border-radius: 6px; border: 1px dashed var(--border-color);
    }

    #game-screen { 
      display: none; 
      width: 100%; 
      max-width: 1350px; 
      justify-content: center;
    }
    
    .layout { 
      display: flex; 
      gap: 20px; 
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    @media (min-width: 1000px) {
      .layout {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    #board-frame {
      background: var(--bg-antracit-panel);
      padding: 12px; 
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      border: 1px solid var(--border-color);
      flex: 1 1 auto;
      width: 100%;
      max-width: min(100%, 750px);
    }

    #board { 
      display: grid; 
      grid-template-columns: repeat(15, 1fr); 
      gap: 2px; 
      background: var(--board-grid); 
      padding: 4px; 
      border-radius: 6px; 
      width: 100%; 
      aspect-ratio: 1 / 1;
      container-type: inline-size;
    }
    
    .cell { 
      background: var(--cell-default); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: clamp(8px, 1.8cqw, 14px); 
      font-weight: 800; 
      border-radius: 2px; 
      position: relative; 
      user-select: none; 
      color: #ffffff; 
      overflow: hidden;
      transition: background-color 0.15s;
    }
    
    .cell.drag-over { background: var(--honey-main) !important; color: #121416; }
    .cell.L2 { background: var(--cell-2l); } 
    .cell.L3 { background: var(--cell-3l); } 
    .cell.W2 { background: var(--cell-2w); } 
    .cell.W3 { background: var(--cell-3w); } 
    .cell.STAR { background: var(--cell-2w); font-size: clamp(10px, 2.2cqw, 18px); }

    .tile { 
      background: var(--tile-bg); color: var(--tile-text); 
      width: 100%; height: 100%; border-radius: 3px; 
      display: flex; align-items: center; justify-content: center; 
      font-weight: 900; 
      font-size: clamp(10px, 2.8cqw, 22px); 
      font-family: 'Arial Black', sans-serif;
      position: relative; cursor: grab; border: 1px solid var(--tile-border);
      box-shadow: var(--tile-shadow); user-select: none;
    }
    .tile:active { cursor: grabbing; }
    
    #rack .tile { 
      width: clamp(34px, 8vw, 48px); 
      height: clamp(34px, 8vw, 48px); 
      font-size: clamp(16px, 4vw, 24px); 
      border-radius: 4px; 
    }
    
    .tile .pts { 
      position: absolute; 
      bottom: 2px; 
      right: 3px; 
      font-size: clamp(6px, 1.2cqw, 9px); 
      color: #555; 
    } 
    #rack .tile .pts { font-size: 10px; }
    .tile.selected { outline: 3px solid var(--honey-main); box-shadow: 0 0 8px var(--honey-main); }

    .sidebars-wrapper {
      display: flex;
      gap: 15px;
      flex-direction: column;
      width: 100%;
      max-width: 380px;
      flex-shrink: 0;
    }

    @media (min-width: 1250px) {
      .sidebars-wrapper {
        flex-direction: row;
        max-width: 720px;
      }
    }

    .sidebar { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      width: 100%; 
      max-width: 350px;
      flex-shrink: 0;
    }

    .panel { 
      background: var(--bg-antracit-panel); padding: 15px; 
      border-radius: 8px; border: 1px solid var(--border-color);
    }
    .panel h3 { font-size: 16px; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; color: var(--honey-light); }
    
    .player-row { 
      display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; 
      border-radius: 6px; margin-bottom: 6px; background: var(--bg-antracit-dark); color: #9da5ac; font-size: 14px;
      border: 1px solid transparent;
    }
    
    /* ZVÝRAZNĚNÍ AKTIVNÍHO HRÁČE (BEZ PULZOVÁNÍ) */
    .player-row.active { 
      border: 2px solid var(--honey-main); 
      background: linear-gradient(135deg, #272c30 0%, #1a2228 100%); 
      color: #ffffff; 
      box-shadow: 0 0 8px rgba(212, 163, 89, 0.3);
    }

    .rack-container {
      background: var(--bg-antracit-dark); padding: 10px; 
      border-radius: 6px; border: 1px solid var(--border-color); margin-top: 5px;
    }
    #rack { display: flex; gap: 6px; min-height: 52px; align-items: center; justify-content: center; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .controls button { width: 100%; font-size: 13px; padding: 10px; }

    .commentary-box {
      margin-top: 10px; padding: 10px;
      background: var(--bg-antracit-dark); border: 1px solid var(--border-color);
      border-radius: 4px; font-size: 13px; color: var(--honey-light);
      font-style: italic; min-height: 48px; display: flex;
      align-items: center; justify-content: center; text-align: center;
    }

    /* CHAT STYLES */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 380px;
    }
    .chat-messages {
      flex: 1;
      background: var(--bg-antracit-dark);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 8px;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .chat-msg {
      word-break: break-word;
      line-height: 1.3;
    }
    .chat-msg .author {
      font-weight: bold;
      color: var(--honey-main);
    }
    .chat-input-row {
      display: flex;
      gap: 6px;
    }
    .chat-input-row input {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-antracit-dark);
      color: #ffffff;
      font-size: 13px;
    }
    .chat-input-row button {
      padding: 8px 12px;
      font-size: 13px;
    }

    /* VYHODNOCOVACÍ MODÁLNÍ OKNO */
    #game-over-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--bg-antracit-panel);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    .modal-content h2 { color: var(--honey-main); margin-bottom: 15px; font-size: 28px; }
    .final-score-row {
      display: flex; justify-content: space-between; padding: 10px;
      background: var(--bg-antracit-dark); margin-bottom: 6px; border-radius: 4px;
      font-size: 16px; font-weight: bold;
    }
    .winner-highlight {
      border: 2px solid var(--honey-main);
      background: #272c30;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- OBRAZOVKA PŘIPOJENÍ -->
  <div id="setup-screen">
    <h2>Scrabble Online</h2>
    <div style="margin-bottom: 15px;">
      <label style="font-size: 12px; color: #9da5ac;">Tvoje jméno:</label>
      <input type="text" id="player-name-input" placeholder="Napiš své jméno" value="Hráč">
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <button onclick="createGame()" style="flex:1;">Založit hru</button>
    </div>

    <div style="border-top: 1px solid var(--border-color); padding-top: 15px;">
      <label style="font-size: 12px; color: #9da5ac;">Máš kód od zakladatele?</label>
      <input type="text" id="join-code-input" placeholder="Vlož Kód místnosti">
      <button onclick="joinGame()" style="width: 100%; background: linear-gradient(to bottom, #2b6cb0, #1a4971); color:#fff; border-color:#153a5b;">Připojit se ke hře</button>
    </div>

    <div id="lobby-info" class="lobby-box" style="display: none;">
      <p style="font-size: 12px; color: #9da5ac;">KÓD MÍSTNOSTI PRO OSTATNÍ:</p>
      <h1 id="room-code-display" style="color: var(--honey-main); letter-spacing: 3px; margin: 5px 0;">----</h1>
      <p style="font-size: 12px; color: #9da5ac; margin-top: 8px;">Připojení hráči:</p>
      <ul id="connected-players-list" style="list-style: none; margin: 5px 0; font-weight: bold;"></ul>
      <button id="shuffle-btn" onclick="shufflePlayers()" style="margin-top: 10px; display: none; width: 100%; background: linear-gradient(to bottom, #4a5056, #33373b); color:#fff; border-color:#222528;">Rozlosovat pořadí</button>
      <button id="start-btn" onclick="hostStartGame()" style="margin-top: 10px; display: none; width: 100%;">Odstartovat hru!</button>
    </div>
  </div>

  <!-- HERNÍ OBRAZOVKA -->
  <div id="game-screen">
    <div class="layout">
      <div id="board-frame">
        <div id="board"></div>
      </div>

      <div class="sidebars-wrapper">
        <div class="sidebar">
          <div class="panel">
            <h3>Skóre</h3>
            <div id="scoreboard"></div>
            <p style="margin-top: 8px; font-size: 12px; color: #9da5ac;">Kamenů v pytlíku: <strong id="bag-count" style="color:var(--honey-light);">0</strong></p>
          </div>

          <div class="panel">
            <h3 id="current-player-title">Na tahu: -</h3>
            <p style="font-size: 11px; color: #9da5ac; margin-bottom: 4px;">Moje kameny:</p>
            
            <div class="rack-container">
              <div id="rack"></div>
            </div>
            
            <div class="controls">
              <button id="btn-play" onclick="playTurn()">Potvrdit</button>
              <button id="btn-swap" onclick="swapSelectedTiles()" style="background: linear-gradient(to bottom, #2b6cb0, #1a4971); color:#fff; border-color:#153a5b;">Výměna</button>
              <button id="btn-recall" onclick="recallTiles()" style="background: linear-gradient(to bottom, #8c3a3a, #662222); color:#fff; border-color:#551111;">Vrátit</button>
              <button id="btn-pass" onclick="passTurn()" style="background: linear-gradient(to bottom, #4a5056, #33373b); color:#fff; border-color:#222528; grid-column: span 2;">Pass</button>
            </div>

            <div class="commentary-box" id="commentary">
              🗣️ Scrabble Online v7
            </div>
          </div>
        </div>

        <div class="sidebar">
          <div class="panel chat-panel">
            <h3>Herní chat</h3>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
              <input type="text" id="chat-input" placeholder="Napište zprávu..." onkeydown="if(event.key==='Enter') sendChatMessage()">
              <button onclick="sendChatMessage()">Odeslat</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODÁLNÍ OKNO PRO KONEC HRY -->
  <div id="game-over-modal">
    <div class="modal-content">
      <h2>Konec hry!</h2>
      <p id="game-over-reason" style="margin-bottom: 15px; color: #9da5ac; font-size: 14px;"></p>
      <div id="final-scores-list" style="margin-bottom: 20px;"></div>
      <button onclick="location.reload()" style="width: 100%; padding: 12px; font-size: 15px;">Hrát znovu</button>
    </div>
  </div>

<script>
  const CZECH_TILES = [
    { l: '★', p: 0, c: 2, isWildcard: true },
    { l: 'A', p: 1, c: 5 }, { l: 'Á', p: 2, c: 2 }, { l: 'B', p: 3, c: 2 }, 
    { l: 'C', p: 2, c: 3 }, { l: 'Č', p: 4, c: 1 }, { l: 'D', p: 1, c: 3 }, 
    { l: 'Ď', p: 8, c: 1 }, { l: 'E', p: 1, c: 5 }, { l: 'É', p: 3, c: 1 }, 
    { l: 'Ě', p: 3, c: 2 }, { l: 'F', p: 5, c: 1 }, { l: 'G', p: 5, c: 1 }, 
    { l: 'H', p: 2, c: 3 }, { l: 'CH', p: 4, c: 2 }, { l: 'I', p: 1, c: 4 }, 
    { l: 'Í', p: 2, c: 3 }, { l: 'J', p: 2, c: 2 }, { l: 'K', p: 1, c: 3 }, 
    { l: 'L', p: 1, c: 3 }, { l: 'M', p: 2, c: 3 }, { l: 'N', p: 1, c: 5 }, 
    { l: 'Ň', p: 10, c: 1 }, { l: 'O', p: 1, c: 6 }, { l: 'Ó', p: 7, c: 1 }, 
    { l: 'P', p: 1, c: 3 }, { l: 'R', p: 1, c: 3 }, { l: 'Ř', p: 4, c: 2 }, 
    { l: 'S', p: 1, c: 4 }, { l: 'Š', p: 4, c: 2 }, { l: 'T', p: 1, c: 4 }, 
    { l: 'Ť', p: 7, c: 1 }, { l: 'U', p: 1, c: 3 }, { l: 'Ú', p: 5, c: 1 }, 
    { l: 'Ů', p: 4, c: 1 }, { l: 'V', p: 1, c: 4 }, { l: 'X', p: 10, c: 1 }, 
    { l: 'Y', p: 2, c: 2 }, { l: 'Ý', p: 4, c: 2 }, { l: 'Z', p: 2, c: 2 }, 
    { l: 'Ž', p: 4, c: 1 }
  ];

  const LAYOUT = [
    ['W3','','','L2','','','','W3','','','','L2','','','W3'],
    ['','W2','','','','L3','','','','L3','','','','W2',''],
    ['','','W2','','','','L2','','L2','','','','W2','',''],
    ['L2','','','W2','','','','L2','','','','W2','','','L2'],
    ['','','','','W2','','','','','','W2','','','',''],
    ['','L3','','','','L3','','','','L3','','','','L3',''],
    ['','','L2','','','','L2','','L2','','','','L2','',''],
    ['W3','','','L2','','','','STAR','','','','L2','','','W3'],
    ['','','L2','','','','L2','','L2','','','','L2','',''],
    ['','L3','','','','L3','','','','L3','','','','L3',''],
    ['','','','','W2','','','','','','W2','','','',''],
    ['L2','','','W2','','','','L2','','','','W2','','','L2'],
    ['','','W2','','','','L2','','L2','','','','W2','',''],
    ['','W2','','','','L3','','','','L3','','','','W2',''],
    ['W3','','','L2','','','','W3','','','','L2','','','W3']
  ];

  let peer = null;
  let myId = null;
  let isHost = false;
  let hostConn = null; 
  let clientConns = []; 

  let myName = "";
  let players = []; 
  let activePlayerIdx = 0;
  let tileBag = [];
  let boardState = Array(15).fill(null).map(() => Array(15).fill(null));
  let uncommitted = [];
  let selectedRackIndices = [];
  let currentCommentary = "🗣️ Scrabble Online v7";
  let chatMessages = [];
  let consecutivePasses = 0;
  let isGameOver = false;

  function generateRoomCode() {
    return Math.floor(1000 + Math.random() * 9000).toString();
  }

  function createGame() {
    myName = document.getElementById('player-name-input').value.trim() || 'Zakladatel';
    isHost = true;
    const roomCode = generateRoomCode();

    peer = new Peer('scrabble-room-' + roomCode);

    peer.on('open', (id) => {
      myId = id;
      document.getElementById('lobby-info').style.display = 'block';
      document.getElementById('room-code-display').innerText = roomCode;
      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('shuffle-btn').style.display = 'block';
      
      players = [{ id: myId, name: myName, score: 0, rack: [] }];
      updateLobbyUI();
    });

    peer.on('connection', (conn) => {
      clientConns.push(conn);
      conn.on('data', (data) => handleHostMessage(conn, data));
    });

    peer.on('error', (err) => alert('Chyba při zakládání: ' + err.type));
  }

  function joinGame() {
    myName = document.getElementById('player-name-input').value.trim() || 'Hráč';
    const roomCode = document.getElementById('join-code-input').value.trim();
    if (!roomCode) return alert('Zadejte kód místnosti!');

    isHost = false;
    peer = new Peer();

    peer.on('open', (id) => {
      myId = id;
      hostConn = peer.connect('scrabble-room-' + roomCode);

      hostConn.on('open', () => {
        hostConn.send({ type: 'JOIN', name: myName, id: myId });
        document.getElementById('lobby-info').style.display = 'block';
        document.getElementById('room-code-display').innerText = roomCode;
      });

      hostConn.on('data', (data) => handleClientMessage(data));
    });

    peer.on('error', () => alert('Kód místnosti nenalezen!'));
  }

  function shufflePlayers() {
    if (!isHost) return;
    for (let i = players.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [players[i], players[j]] = [players[j], players[i]];
    }
    updateLobbyUI();
    broadcast({ type: 'LOBBY_UPDATE', players });
  }

  function updateLobbyUI() {
    const list = document.getElementById('connected-players-list');
    list.innerHTML = players.map(p => `<li>• ${p.name}</li>`).join('');
  }

  function handleHostMessage(conn, data) {
    if (data.type === 'JOIN') {
      players.push({ id: data.id, name: data.name, score: 0, rack: [] });
      updateLobbyUI();
      broadcast({ type: 'LOBBY_UPDATE', players });
    }
    if (data.type === 'PLAY_TURN') handleRemoteTurn(data);
    if (data.type === 'SWAP_TILES') handleRemoteSwap(data);
    if (data.type === 'PASS_TURN') handleRemotePass();
    if (data.type === 'CHAT_MSG') {
      chatMessages.push(data.msg);
      broadcast({ type: 'CHAT_MSG', msg: data.msg });
      updateChatUI();
    }
  }

  function handleClientMessage(data) {
    if (data.type === 'LOBBY_UPDATE') {
      players = data.players;
      updateLobbyUI();
      return;
    }
    if (data.type === 'SYNC_STATE') {
      syncGameState(data.state);
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      if (data.state.isGameOver) {
        showGameOverModal(data.state.gameOverData);
      }
    }
    if (data.type === 'CHAT_MSG') {
      chatMessages.push(data.msg);
      updateChatUI();
    }
  }

  function broadcast(data) {
    clientConns.forEach(c => {
      if (c.open) c.send(data);
    });
  }

  function hostStartGame() {
    if (players.length < 2) return alert('K hraní jsou potřeba alespoň 2 hráči!');

    tileBag = [];
    CZECH_TILES.forEach(item => {
      for (let i = 0; i < item.c; i++) {
        tileBag.push({ letter: item.l, pts: item.p, isWildcard: !!item.isWildcard, assignedLetter: null });
      }
    });
    tileBag.sort(() => Math.random() - 0.5);

    players.forEach(p => { p.rack = drawTiles(7); });
    consecutivePasses = 0;
    isGameOver = false;

    notifyHostOrBroadcast();
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
  }

  function drawTiles(count) {
    const drawn = [];
    for (let i = 0; i < count && tileBag.length > 0; i++) {
      drawn.push(tileBag.pop());
    }
    return drawn;
  }

  function getGameState() {
    return {
      players: JSON.parse(JSON.stringify(players)),
      activePlayerIdx,
      tileBag: JSON.parse(JSON.stringify(tileBag)),
      boardState: JSON.parse(JSON.stringify(boardState)),
      currentCommentary,
      chatMessages: JSON.parse(JSON.stringify(chatMessages)),
      isGameOver,
      gameOverData: window._lastGameOverData || null
    };
  }

  function syncGameState(state) {
    players = JSON.parse(JSON.stringify(state.players || []));
    activePlayerIdx = Number.isInteger(state.activePlayerIdx) ? state.activePlayerIdx : 0;
    tileBag = JSON.parse(JSON.stringify(state.tileBag || []));
    boardState = JSON.parse(JSON.stringify(state.boardState || Array(15).fill(null).map(() => Array(15).fill(null))));
    currentCommentary = state.currentCommentary || '';
    chatMessages = JSON.parse(JSON.stringify(state.chatMessages || []));
    isGameOver = !!state.isGameOver;

    uncommitted = [];
    selectedRackIndices = [];

    const boardEl = document.getElementById('board');
    if (boardEl) boardEl.innerHTML = '';

    renderBoard();
    updateUI();
    updateChatUI();
    
    if (isGameOver && state.gameOverData) {
      showGameOverModal(state.gameOverData);
    }
  }

  function notifyHostOrBroadcast(messageType = 'SYNC_STATE') {
    const state = getGameState();
    if (isHost) {
      broadcast({ type: messageType, state });
      syncGameState(state);
    }
  }

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 15; c++) {
        const cell = document.createElement('div');
        const type = LAYOUT[r][c];
        cell.className = `cell ${type}`;
        cell.dataset.r = r; cell.dataset.c = c;
        if (!boardState[r][c]) {
          if (type === 'L2' || type === 'W2') cell.innerText = '2x';
          if (type === 'L3' || type === 'W3') cell.innerText = '3x';
          if (type === 'STAR') cell.innerText = '★';
        }

        cell.onclick = () => onCellClick(r, c);

        cell.ondragover = (e) => {
          e.preventDefault();
          if (!isGameOver && players[activePlayerIdx] && players[activePlayerIdx].id === myId && !boardState[r][c]) {
            cell.classList.add('drag-over');
          }
        };
        cell.ondragleave = () => cell.classList.remove('drag-over');
        cell.ondrop = (e) => {
          e.preventDefault();
          cell.classList.remove('drag-over');
          if (isGameOver || !players[activePlayerIdx] || players[activePlayerIdx].id !== myId || boardState[r][c]) return;
          const rackIdxData = e.dataTransfer.getData('text/plain');
          if (rackIdxData !== '') {
            placeTileOnBoard(parseInt(rackIdxData, 10), r, c);
          }
        };

        boardEl.appendChild(cell);

        if (boardState[r][c]) {
          renderTileInCell(cell, r, c);
        }
      }
    }
  }

  function updateUI() {
    const myTurn = !isGameOver && players[activePlayerIdx] && players[activePlayerIdx].id === myId;
    
    document.getElementById('btn-play').disabled = !myTurn;
    document.getElementById('btn-swap').disabled = !myTurn;
    document.getElementById('btn-recall').disabled = !myTurn;
    document.getElementById('btn-pass').disabled = !myTurn;

    const sb = document.getElementById('scoreboard');
    sb.innerHTML = '';
    players.forEach((p, idx) => {
      const isActive = (idx === activePlayerIdx);
      const div = document.createElement('div');
      div.className = `player-row ${isActive ? 'active' : ''}`;
      
      let indicator = isActive ? '➡️ ' : '';
      div.innerHTML = `<span>${indicator}${p.name} ${p.id === myId ? '(Ty)' : ''}</span><strong>${p.score} b.</strong>`;
      sb.appendChild(div);
    });

    document.getElementById('bag-count').innerText = tileBag.length;
    document.getElementById('current-player-title').innerText = isGameOver ? "Hra skončila" : `Na tahu: ${players[activePlayerIdx] ? players[activePlayerIdx].name : '-'}`;

    const commEl = document.getElementById('commentary');
    if (commEl) commEl.innerText = currentCommentary;

    renderRack();
  }

  function getMyPlayer() {
    return players.find(p => p.id === myId);
  }

  function renderRack() {
    const rackEl = document.getElementById('rack');
    rackEl.innerHTML = '';
    const myPlayer = getMyPlayer();
    if (!myPlayer) return;

    const isMyTurn = !isGameOver && players[activePlayerIdx] && players[activePlayerIdx].id === myId;

    myPlayer.rack.forEach((tile, idx) => {
      const tileEl = document.createElement('div');
      tileEl.className = 'tile';
      const displayLetter = tile.isWildcard && tile.assignedLetter ? tile.assignedLetter : tile.letter;
      tileEl.innerHTML = `${displayLetter}<span class="pts">${tile.pts}</span>`;

      if (selectedRackIndices.includes(idx)) tileEl.classList.add('selected');

      if (isMyTurn) {
        tileEl.draggable = true;
        tileEl.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', idx.toString());
          e.dataTransfer.effectAllowed = 'move';
        };
      }

      tileEl.onclick = () => {
        if (!isMyTurn) return;
        if (selectedRackIndices.includes(idx)) {
          selectedRackIndices = selectedRackIndices.filter(i => i !== idx);
        } else {
          selectedRackIndices.push(idx);
        }
        renderRack();
      };

      rackEl.appendChild(tileEl);
    });
  }

  function renderTileInCell(cellEl, r, c) {
    cellEl.innerHTML = '';
    const tile = boardState[r][c];
    if (!tile) return;

    const tileEl = document.createElement('div');
    tileEl.className = 'tile';
    const displayLetter = tile.isWildcard && tile.assignedLetter ? tile.assignedLetter : tile.letter;
    tileEl.innerHTML = `${displayLetter}<span class="pts">${tile.pts}</span>`;
    cellEl.appendChild(tileEl);
  }

  function onCellClick(r, c) {
    if (isGameOver || !players[activePlayerIdx] || players[activePlayerIdx].id !== myId) return;
    if (selectedRackIndices.length === 1 && !boardState[r][c]) {
      placeTileOnBoard(selectedRackIndices[0], r, c);
    }
  }

  function placeTileOnBoard(rackIdx, r, c) {
    const p = getMyPlayer();
    const tile = p.rack[rackIdx];
    if (!tile) return;

    if (tile.isWildcard && !tile.assignedLetter) {
      const input = prompt('Zadejte písmeno pro žolíka:');
      if (input && input.trim().length > 0) {
        tile.assignedLetter = input.trim().toUpperCase();
      } else return;
    }

    p.rack.splice(rackIdx, 1);
    boardState[r][c] = tile;
    uncommitted.push({ r, c, tile });
    selectedRackIndices = [];

    renderBoard();
    renderRack();
  }

  function recallTiles() {
    const p = getMyPlayer();
    if (!p) return;
    uncommitted.forEach(u => {
      if (u.tile.isWildcard) u.tile.assignedLetter = null;
      boardState[u.r][u.c] = null;
      p.rack.push(u.tile);
    });
    uncommitted = [];
    selectedRackIndices = [];
    renderBoard();
    renderRack();
  }

  function playTurn() {
    if (uncommitted.length === 0) return alert('Nejdříve položte kameny na desku!');

    const myPlayer = getMyPlayer();
    const currentRackState = JSON.parse(JSON.stringify(myPlayer.rack));
    const uncommittedCopy = JSON.parse(JSON.stringify(uncommitted));
    const boardStateCopy = JSON.parse(JSON.stringify(boardState));

    if (isHost) {
      processTurnLogic(activePlayerIdx, uncommittedCopy, boardStateCopy, currentRackState);
    } else {
      hostConn.send({ 
        type: 'PLAY_TURN', 
        uncommitted: uncommittedCopy, 
        boardState: boardStateCopy, 
        rack: currentRackState 
      });
    }
  }

  function handleRemoteTurn(data) {
    const targetPlayerIdx = activePlayerIdx; 
    players[targetPlayerIdx].rack = data.rack;
    uncommitted = data.uncommitted;
    boardState = data.boardState;
    processTurnLogic(targetPlayerIdx, data.uncommitted, data.boardState, data.rack);
  }

  function processTurnLogic(playerIdx, turnUncommitted, currentBoardState, playerRack) {
    consecutivePasses = 0; 
    let totalTurnScore = 0;
    let countedTileKeys = new Set();

    function getWordTiles(startR, startC, isHorizontal) {
      let r = startR, c = startC;
      let tiles = [];
      while (r >= 0 && r < 15 && c >= 0 && c < 15 && currentBoardState[r][c] !== null) {
        tiles.push({ r, c, tile: currentBoardState[r][c] });
        if (isHorizontal) c++; else r++;
      }
      return tiles;
    }

    function evaluateSpecificWord(wordTiles) {
      if (wordTiles.length <= 1) return 0;
      let wordScore = 0;
      let wordMultiplier = 1;

      wordTiles.forEach(wt => {
        let tilePts = wt.tile.pts;
        let isNewlyPlaced = turnUncommitted.some(u => u.r === wt.r && u.c === wt.c);

        if (isNewlyPlaced) {
          let type = LAYOUT[wt.r][wt.c];
          if (type === 'L2') tilePts *= 2;
          if (type === 'L3') tilePts *= 3;
          if (type === 'W2' || type === 'STAR') wordMultiplier *= 2;
          if (type === 'W3') wordMultiplier *= 3;

          countedTileKeys.add(`${wt.r},${wt.c}`);
        }
        wordScore += tilePts;
      });
      return wordScore * wordMultiplier;
    }

    let rows = turnUncommitted.map(u => u.r);
    let cols = turnUncommitted.map(u => u.c);
    let isHorizontal = rows.every(r => r === rows[0]);

    if (turnUncommitted.length === 1) {
      let r = turnUncommitted[0].r, c = turnUncommitted[0].c;
      
      let startC = c;
      while (startC > 0 && currentBoardState[r][startC - 1] !== null) startC--;
      let wordH = getWordTiles(r, startC, true);

      let startR = r;
      while (startR > 0 && currentBoardState[startR - 1][c] !== null) startR--;
      let wordV = getWordTiles(startR, c, false);

      let scoreH = evaluateSpecificWord(wordH);
      let scoreV = evaluateSpecificWord(wordV);
      totalTurnScore = Math.max(scoreH, scoreV);
    } else {
      let startR = rows[0], startC = cols[0];
      if (isHorizontal) {
        while (startC > 0 && currentBoardState[startR][startC - 1] !== null) startC--;
      } else {
        while (startR > 0 && currentBoardState[startR - 1][startC] !== null) startR--;
      }
      let mainWordTiles = getWordTiles(startR, startC, isHorizontal);
      totalTurnScore += evaluateSpecificWord(mainWordTiles);

      turnUncommitted.forEach(u => {
        let crossStartR = u.r, crossStartC = u.c;
        if (isHorizontal) {
          while (crossStartR > 0 && currentBoardState[crossStartR - 1][crossStartC] !== null) crossStartR--;
          let crossWord = getWordTiles(crossStartR, crossStartC, false);
          totalTurnScore += evaluateSpecificWord(crossWord);
        } else {
          while (crossStartC > 0 && currentBoardState[crossStartR][crossStartC - 1] !== null) crossStartC--;
          let crossWord = getWordTiles(crossStartR, crossStartC, true);
          totalTurnScore += evaluateSpecificWord(crossWord);
        }
      });
    }

    if (totalTurnScore === 0) {
      turnUncommitted.forEach(u => {
        totalTurnScore += u.tile.pts;
      });
    }

    if (turnUncommitted.length === 7) {
      totalTurnScore += 50;
      currentCommentary = `🔥 ${players[playerIdx].name} zahrál BINGO (+50 bodů)!`;
    } else {
      currentCommentary = `✨ ${players[playerIdx].name} získal ${totalTurnScore} bodů.`;
    }

    players[playerIdx].score += totalTurnScore;
    boardState = currentBoardState;

    const neededTiles = 7 - playerRack.length;
    const newlyDrawn = drawTiles(neededTiles);
    players[playerIdx].rack = playerRack.concat(newlyDrawn);

    uncommitted = [];

    if (tileBag.length === 0 && players[playerIdx].rack.length === 0) {
      endGame(`${players[playerIdx].name} vyložil všechny kameny!`);
      return;
    }

    activePlayerIdx = (activePlayerIdx + 1) % players.length;
    notifyHostOrBroadcast();
  }

  function passTurn() {
    if (!isHost) {
      hostConn.send({ type: 'PASS_TURN' });
      return;
    }
    executePass();
  }

  function handleRemotePass() {
    executePass();
  }

  function executePass() {
    currentCommentary = `⏭️ ${players[activePlayerIdx].name} vynechal tah.`;
    consecutivePasses++;
    
    if (consecutivePasses >= players.length * 2) {
      endGame("Hra skončila: Všichni hráči dvakrát po sobě pasovali.");
      return;
    }

    activePlayerIdx = (activePlayerIdx + 1) % players.length;
    notifyHostOrBroadcast();
  }

  function swapSelectedTiles() {
    const myPlayer = getMyPlayer();
    if (selectedRackIndices.length === 0) return alert('Vyberte kameny k výměně!');
    if (tileBag.length < selectedRackIndices.length) return alert('V pytlíku není dostatek kamenů pro výměnu!');

    selectedRackIndices.sort((a, b) => b - a);
    const tilesToSwap = [];

    selectedRackIndices.forEach(idx => {
      tilesToSwap.push(myPlayer.rack.splice(idx, 1)[0]);
    });

    const newTiles = drawTiles(tilesToSwap.length);
    myPlayer.rack = myPlayer.rack.concat(newTiles);
    tileBag = tileBag.concat(tilesToSwap);
    tileBag.sort(() => Math.random() - 0.5);

    selectedRackIndices = [];
    currentCommentary = `🔄 ${myPlayer.name} vyměnil ${tilesToSwap.length} kamenů.`;

    consecutivePasses = 0;
    activePlayerIdx = (activePlayerIdx + 1) % players.length;
    notifyHostOrBroadcast();
  }

  function endGame(reasonText) {
    isGameOver = true;
    
    players.forEach(p => {
      let penalty = 0;
      p.rack.forEach(tile => {
        penalty += tile.pts;
      });
      p.score -= penalty;
      if (p.score < 0) p.score = 0;
    });

    let sortedPlayers = [...players].sort((a, b) => b.score - a.score);

    window._lastGameOverData = {
      reason: reasonText,
      ranking: sortedPlayers
    };

    notifyHostOrBroadcast();
  }

  function showGameOverModal(data) {
    document.getElementById('game-over-reason').innerText = data.reason;
    const listEl = document.getElementById('final-scores-list');
    listEl.innerHTML = '';

    data.ranking.forEach((p, index) => {
      const row = document.createElement('div');
      row.className = `final-score-row ${index === 0 ? 'winner-highlight' : ''}`;
      row.innerHTML = `<span>${index + 1}. ${p.name}</span> <span>${p.score} bodů</span>`;
      listEl.appendChild(row);
    });

    document.getElementById('game-over-modal').style.display = 'flex';
    document.getElementById('game-screen').style.display = 'flex';
  }

  // CHAT FUNKCE
  function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    const msg = { author: myName, text: text };
    input.value = '';

    if (isHost) {
      chatMessages.push(msg);
      broadcast({ type: 'CHAT_MSG', msg: msg });
      updateChatUI();
    } else {
      hostConn.send({ type: 'CHAT_MSG', msg: msg });
    }
  }

  function updateChatUI() {
    const chatContainer = document.getElementById('chat-messages');
    if (!chatContainer) return;
    chatContainer.innerHTML = chatMessages.map(m => `
      <div class="chat-msg">
        <span class="author">${escapeHtml(m.author)}:</span> ${escapeHtml(m.text)}
      </div>
    `).join('');
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
